# Weekly cam refresh: checks every cam, swaps in new links for cams that moved,
# retires dead ones and adds a few new live animal cams. Favorites carry over
# because cam ids never change.
#
# Needs a repository secret named YOUTUBE_API_KEY
# (Settings → Secrets and variables → Actions → New repository secret).
# Without it, the run is skipped with a note instead of failing.
# You can also run it any time from the Actions tab → "Weekly cam refresh" → Run workflow.
name: Weekly cam refresh

on:
  schedule:
    # Mondays at 10:17 UTC = 4:17 am in Denver in winter, 5:17 am in summer.
    # GitHub sometimes starts scheduled runs a few hours late when it's busy.
    - cron: "17 10 * * 1"
  workflow_dispatch:
  # Temporary: run once when this file changes, to test the fix. Remove afterwards.
  push:
    branches: [main]
    paths: [".github/workflows/refresh-cams.yml"]

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-cams
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh the cam list
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/refresh-cams.mjs

      - name: Save the new list
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/streams.js data/refresh-log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Weekly cam refresh ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits made by this workflow don't always trigger a GitHub Pages rebuild,
      # so ask for one directly.
      - name: Update the live site
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick up the change on its next build."
